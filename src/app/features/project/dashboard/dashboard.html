<div class="dashboard">

  <div class="dashboard-header">{{ row().tag }}</div>

  <div class="dashboard-body">
    <div class="dashboard-grid">

      <div class="dashboard-item">
        <strong>Data Inserimento:</strong>
        <span>{{ row().dataInserimento ?? '-' }}</span>
      </div>

      <div class="dashboard-item">
        <strong>Data Invio Kpi Manuali:</strong>
        <span>{{ row().dataInvioManuali ? (row().dataInvioManuali | date: 'dd/MM/yyyy') : '-' }}</span>
      </div>

    </div>

    <div class="actions">
      <strong>Azioni:</strong>
      <div class="action-buttons">

        <button class="avvia" type="button" (click)="avviaSq.emit()" [disabled]="analisiInCorso()" title="Avvia analisi SonarQube">
          {{ analisiInCorso() ? 'Analisi in corso...' : 'Avvia SQ' }}
        </button>

        <button type="button" (click)="kpiManuali.emit()" title="Inserisci i KPI manuali del tag">Kpi manuali</button>
        <button type="button" class="dashboard-button" routerLink="/fact" [queryParams]="{ progetto: progetto() }">Dashboard</button>

      </div>
    </div>
  </div>
</div>
